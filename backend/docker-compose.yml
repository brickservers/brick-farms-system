version: '3.8'
services:
  db:
    # Use the official PostGIS image for local development. TimescaleDB is
    # optional for local runs; migrations will skip hypertable creation if it
    # isn't present.
    image: postgis/postgis:14-3.4
    environment:
      POSTGRES_USER: brickfarm
      POSTGRES_PASSWORD: brickfarm_pass
      POSTGRES_DB: brickfarm
    ports:
      # Map container port 5432 to host 5433 to avoid colliding with a host postgres on 5432
      - "5433:5432"
    volumes:
      # Use a fresh named volume for local dev to avoid clashes with any
      # existing database clusters that may require extensions not present
      # in this image. This preserves the original `db_data` volume.
      - db_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      # Map container redis port 6379 to host 6380 to avoid colliding with host redis
      - "6380:6379"

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_USER: brickfarm
      DB_PASS: brickfarm_pass
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: brickfarm
    depends_on:
      - db
      - redis

volumes:
  db_data:
  db_data_dev:
